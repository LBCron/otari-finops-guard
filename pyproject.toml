[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otari-finops-guard"
version = "1.0.0"
description = "Per-Task & Per-Subagent Virtual Key Provisioning, Adaptive Open-Weight Model Routing, and Hard Budget Guardrails for Mozilla Otari"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "LBCron", email = "ronanchenlopes@gmail.com" },
]
keywords = ["mozilla", "otari", "finops", "ai-gateway", "open-weight", "multi-agent", "budgets", "guardrails", "mcp"]
dependencies = [
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
otari-finops-guard = "otari_finops_guard.cli:app"
otari-finops-demo = "otari_finops_guard.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/otari_finops_guard/dashboard.py" = ["E501"]
